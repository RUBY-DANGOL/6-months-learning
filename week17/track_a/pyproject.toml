[project]
name = "week17-churn-mlops"
version = "0.1.0"
description = "Reproducible Telco churn training, registry, serving, and drift monitoring"
requires-python = ">=3.11,<3.14"
dependencies = [
  "evidently==0.7.20",
  "fastapi==0.120.0",
  "joblib==1.5.2",
  "matplotlib==3.10.7",
  "mlflow==3.5.1",
  "numpy==2.3.4",
  "pandas==2.3.3",
  "scikit-learn==1.7.2",
  "sqlalchemy==2.0.44",
  "uvicorn==0.38.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churn_mlops"]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==8.4.2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
