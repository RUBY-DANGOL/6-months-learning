[project]
name = "week17-agent-mlops"
version = "0.1.0"
description = "Prompt experiments, complete agent traces, and regression gates"
requires-python = ">=3.11,<3.14"
dependencies = [
  "evidently==0.7.20",
  "mlflow==3.5.1",
  "pandas==2.3.3",
  "sqlalchemy==2.0.44",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_mlops"]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
