name: rag-assistant

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ': > /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  vllm:
    image: vllm/vllm-openai:v0.6.6
    profiles: ["gpu"]
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    volumes:
      - hf-cache:/root/.cache/huggingface
    ipc: host
    command:
      - --model=${VLLM_MODEL:-Qwen/Qwen2.5-1.5B-Instruct}
      - --served-model-name=${VLLM_MODEL:-Qwen/Qwen2.5-1.5B-Instruct}
      - --max-model-len=${VLLM_MAX_MODEL_LEN:-4096}
      - --gpu-memory-utilization=${VLLM_GPU_UTIL:-0.88}
      - --dtype=half
      - --enable-prefix-caching
      - --enable-auto-tool-choice
      - --tool-call-parser=hermes
      - --guided-decoding-backend=xgrammar
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test:
        ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 20s
      timeout: 10s
      retries: 40
      start_period: 300s

  api:
    build: ./api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:1.5b}
      LLM_API_KEY: ${LLM_API_KEY:-local}
      FALLBACK_MODELS: ${FALLBACK_MODELS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TEMPERATURE: ${TEMPERATURE:-0.2}
      TOP_P: ${TOP_P:-0.9}
      MAX_TOKENS: ${MAX_TOKENS:-640}
      NUM_RETRIES: ${NUM_RETRIES:-1}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-90}
      BREAKER_THRESHOLD: ${BREAKER_THRESHOLD:-3}
      BREAKER_COOLDOWN: ${BREAKER_COOLDOWN:-30}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-30}
      MAX_CONCURRENT_LLM: ${MAX_CONCURRENT_LLM:-8}
      CACHE_TTL: ${CACHE_TTL:-3600}
      SEMANTIC_THRESHOLD: ${SEMANTIC_THRESHOLD:-0.93}
      TOP_K: ${TOP_K:-4}
      MIN_SCORE: ${MIN_SCORE:-0.55}
      CHUNK_SIZE: ${CHUNK_SIZE:-900}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-150}
      EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-small-en-v1.5}
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      CORPUS_DIR: /corpus
      ROUTER_MODEL_DIR: /models/router
      ENERGY_THRESHOLD: ${ENERGY_THRESHOLD:-}
    volumes:
      - ./corpus:/corpus:ro
      - ./ml/models:/models:ro
      - embed-cache:/cache
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy

  ui:
    build: ./ui
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy

  trainer:
    build: ./ml
    profiles: ["train"]
    volumes:
      - ./ml/models:/models
      - hf-cache:/cache/hf

volumes:
  qdrant-data:
  hf-cache:
  embed-cache:
